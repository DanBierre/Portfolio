<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Washi paper: two crossing layers of long, uneven fibres plus sparse plant-fibre specks. Vector, no raster. -->
  <filter id="long" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.085" numOctaves="3" seed="4" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.29  0 0 0 0 0.27  0 0 0 0 0.24  0 0 0 0.3 -0.11" />
  </filter>
  <filter id="cross" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.07 0.016" numOctaves="2" seed="17" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.25  0 0 0 0.2 -0.08" />
  </filter>
  <filter id="specks" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.55" numOctaves="1" seed="31" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.22  0 0 0 0 0.19  0 0 0 3.2 -2.75" />
  </filter>
  <rect width="480" height="480" filter="url(#long)" />
  <rect width="480" height="480" filter="url(#cross)" />
  <rect width="480" height="480" filter="url(#specks)" opacity="0.5" />
</svg>
